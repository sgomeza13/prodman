name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - run: choco install nsis -y --no-progress

      # Stamp the tag into the installer/uninstaller metadata (v1.2.3 -> 1.2.3)
      - run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          (Get-Content wails.json) -replace '"productVersion": "[^"]*"', "`"productVersion`": `"$v`"" | Set-Content wails.json

      - run: wails build -platform windows/amd64 -nsis -ldflags "-s -w"

      # Literal path, not a glob: a missing installer must fail the job, not publish an empty release
      - run: gh release create "${{ github.ref_name }}" (Get-Item build/bin/prodman-amd64-installer.exe) --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
